name: Kind 2 Nightlies / Release

on:
  workflow_dispatch:
  # Run the nightly build at 8 AM UTC / 2 AM Central
  schedule:
    - cron: "0 8 * * *"
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*'

env:
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  get-nightly-ready:
    if: github.repository == 'kind2-mc/kind2' && !startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Delete old assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ids=$(gh release view nightly --json assets --jq '.assets | map(.name) | .[]')
        for id in $ids;
        do
          gh release delete-asset nightly $id -y
        done

    - name: Update nightly tag
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git tag -f nightly
        git push --tags -f

  create-new-release:
    if: github.repository == 'kind2-mc/kind2' && startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Create new release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat > Release_Notes.txt << EOF
        TODO:
          - Generate and upload user_documentation.pdf
          - Replace this text with the release notes
          - Publish the release!"
        EOF
        gh release create $GITHUB_REF_NAME --verify-tag --draft \
          --title "Kind 2 $GITHUB_REF_NAME" --notes-file Release_Notes.txt \
          --repo $GITHUB_REPOSITORY

  build:
    if: |
      always()
      && github.repository == 'kind2-mc/kind2'
      && contains(needs.*.result, 'success')
      && !contains(needs.*.result, 'failure')

    needs: [get-nightly-ready, create-new-release]
    strategy:
      matrix:
        name: [ linux-x86_64, linux-arm64, macos-x86_64, macos-arm64, windows-x86_64 ]
        ocaml-version: [ 5.5.1 ]
        macos-target: [ 12 ]
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Build Kind 2 linux binary
      if: runner.os == 'Linux'
      uses: docker/build-push-action@v7
      with:
        file: docker/Dockerfile
        context: ./
        target: builder
        load: true
        tags: kind2:latest

    - name: Extract Kind 2 linux binary
      id: extract
      if: runner.os == 'Linux'
      uses: shrink/actions-docker-extract@v4
      with:
        image: kind2:latest
        path: /home/opam/kind2-build/bin/kind2
        destination: ./bin/

    - name: Update package information (macOS)
      if: runner.os == 'macOS'
      run: |
        # Untap aws to silence Homebrew trust warnings
        # See https://github.com/actions/runner-images/issues/14232
        brew untap aws/tap || true
        brew update

    # Build Kind 2 binaries compatible with old versions of macOS
    - name: Set MACOSX_DEPLOYMENT_TARGET
      if: runner.os == 'macOS'
      run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}" >> $GITHUB_ENV

    - name: Build Kind 2 macOS binary
      if: runner.os == 'macOS'
      uses: ./.github/actions/build-kind2
      with:
        ocaml-version: ${{ matrix.ocaml-version }}
        cache-prefix: macos${{ matrix.macos-target }}
        flambda: true
        build-target: static
    
    # Not built statically: the linking flags have no Windows case, and it
    # needs none. Every library the binary imports ships with Windows —
    # kernel32, msvcrt, advapi32, ws2_32, shell32, shlwapi, ole32, version
    # and the synch API set — and it loads nothing else at run time.
    - name: Build Kind 2 Windows binary
      if: runner.os == 'Windows'
      uses: ./.github/actions/build-kind2
      with:
        ocaml-version: ${{ matrix.ocaml-version }}
        cache-prefix: windows

    - name: Test Kind 2 binary
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          ./bin/kind2.exe --version
        else
          ./bin/kind2 --version
        fi

    - name: Create asset
      id: create_asset
      shell: bash
      run: |
        cd bin
        if [[ "$GITHUB_REF" =~ ^refs/tags/v.* ]]; then
          vtag=$GITHUB_REF_NAME
          echo "release=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
        else
          vtag=$(date "+%Y-%m-%d")
          echo "release=nightly" >> $GITHUB_OUTPUT
        fi
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          # A zip is what a Windows user expects, and Compress-Archive is
          # always there, where zip and 7z are not guaranteed.
          asset=kind2-$vtag-windows-x86_64.zip
          powershell -NoProfile -Command \
            "Compress-Archive -Path kind2.exe -DestinationPath $asset"
        else
          chmod u+x kind2
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ptag="${{ matrix.name }}"
          else
            ptag="macos-${{ matrix.macos-target }}-$(uname -m)"
          fi
          asset=kind2-$vtag-$ptag.tar.gz
          tar -czf $asset kind2
        fi
        echo "filepath=./bin/$asset" >> $GITHUB_OUTPUT

    - name: Upload release asset
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ steps.create_asset.outputs.release }} \
          ${{ steps.create_asset.outputs.filepath }} \
          --repo $GITHUB_REPOSITORY


name: Kind2 CI

on: [push, pull_request]

# A new push to a branch cancels this workflow's in-progress runs for it, except
# on main, where every commit is built so its CI status is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  kind2-build:
    strategy:
      matrix:
        name: [ linux-x86_64, linux-arm64, macos-x86_64, macos-arm64, windows-x86_64 ]
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            ocaml-version: 5.5.0
          - name: linux-arm64
            os: ubuntu-24.04-arm
            ocaml-version: 5.5.0
          - name: macos-x86_64
            os: macos-15-intel
            ocaml-version: 5.5.0
          - name: macos-arm64
            os: macos-latest
            ocaml-version: 5.5.0
          - name: windows-x86_64
            os: windows-latest
            ocaml-version: 5.5.0

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Make OCaml warnings fatal
      shell: bash
      run: |
        head -n1 dune-project > dune-workspace
        echo '(profile strict)' >> dune-workspace

    - name: Update package information (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update -y

    - name: Update package information (macOS)
      if: runner.os == 'macOS'
      run: |
        # Untap aws to silence Homebrew trust warnings
        # See https://github.com/actions/runner-images/issues/14232
        brew untap aws/tap || true
        brew update

    - name: Build Kind 2
      uses: ./.github/actions/build-kind2
      with:
        ocaml-version: ${{ matrix.ocaml-version }}

    - name: Install Z3 (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        Z3_VERSION=4.15.3
        ARCH=$(uname -m)
        if [[ "$ARCH" == "x86_64" ]]; then
          Z3_OS_VERSION=x64-glibc-2.39
        else
          Z3_OS_VERSION=arm64-glibc-2.34
        fi
        Z3_ZIP_NAME=z3-$Z3_VERSION-$Z3_OS_VERSION
        wget -q https://github.com/Z3Prover/z3/releases/download/z3-$Z3_VERSION/$Z3_ZIP_NAME.zip
        unzip -q $Z3_ZIP_NAME.zip
        sudo cp $Z3_ZIP_NAME/bin/z3 /usr/bin/

    - name: Install Z3 (macOS)
      if: runner.os == 'macOS'
      run: brew install z3

    - name: Install Z3 (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        Z3_VERSION=4.15.3
        Z3_ZIP_NAME=z3-$Z3_VERSION-x64-win
        curl -sL -o z3.zip https://github.com/Z3Prover/z3/releases/download/z3-$Z3_VERSION/$Z3_ZIP_NAME.zip
        unzip -q z3.zip
        # Use the Windows-style workspace path: the PATH entry must be
        # usable by the native kind2 executable, not only by bash
        echo "$GITHUB_WORKSPACE/$Z3_ZIP_NAME/bin" >> $GITHUB_PATH

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install unit test dependencies
      shell: bash
      run: opam install ounit2

    - name: Run ounit and regression tests
      if: runner.os != 'Windows'
      run: opam exec make test

    - name: Run ounit and regression tests (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        opam exec -- dune build @runtest
        cd tests && ./run

    - name: Setup Hugo
      if: runner.os == 'Linux'
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.146.0'
        extended: true

    - name: Build user documentation
      if: runner.os == 'Linux'
      run: |
        sudo apt-get -y install libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf2.0-0 poppler-utils
        make doc

    - name: Build developer documentation
      if: runner.os == 'Linux'
      run: |
        opam install -y odoc
        opam exec make kind2-doc

    - name: Upload kind2 artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: kind2-${{ matrix.os }}
        path: bin/kind2*
